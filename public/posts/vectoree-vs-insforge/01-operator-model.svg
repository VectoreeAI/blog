  <text x="888" y="632" fill="#d8ff00" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" text-anchor="middle">4</text>
  <text x="940" y="632" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">Site deploy is in the product</text>
