  <text x="132" y="456" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" text-anchor="middle">2</text>
  <text x="184" y="456" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">Agent installs the skill</text>
  <rect x="104" y="506" width="56" height="56" fill="#d8ff00"/>
  <text x="132" y="544" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" text-anchor="middle">3</text>
  <text x="184" y="544" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">login, then link</text>
  <rect x="104" y="594" width="56" height="56" fill="#d8ff00"/>
  <text x="132" y="632" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" text-anchor="middle">4</text>
  <text x="184" y="632" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">One key under .vectoree/</text>
