  <text x="940" y="368" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">Human defines intent</text>
