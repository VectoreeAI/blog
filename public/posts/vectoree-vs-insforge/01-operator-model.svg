  <text x="72" y="86" fill="#9a9a92" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.2" text-anchor="start">WHO OPERATES THE BACKEND</text>
  <text x="72" y="156" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="0" text-anchor="start">Both agents. Different tools.</text>
