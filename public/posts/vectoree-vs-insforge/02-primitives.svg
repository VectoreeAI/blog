  <rect x="96" y="624" width="384" height="58" fill="#2a2a2a"/>
  <text x="116" y="662" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Object storage</text>
  <rect x="96" y="700" width="384" height="58" fill="#2a2a2a"/>
  <text x="116" y="738" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Hosted project</text>
