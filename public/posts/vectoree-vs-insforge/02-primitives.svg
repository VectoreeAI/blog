<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Live primitives</title>
  <desc>Shared Postgres, auth, and storage. Vectoree adds its own gateway and Tool Hub. InsForge adds functions, realtime, sites, and self-host.</desc>
  <rect width="1600" height="900" fill="#101010"/>
  <polygon points="1180,0 1600,0 1600,220" fill="#1c1c1c"/>
  <circle cx="1488" cy="72" r="6" fill="#d8ff00"/>
  <circle cx="1516" cy="72" r="6" fill="#d8ff00"/>
  <circle cx="1544" cy="72" r="6" fill="#d8ff00"/>
  <text x="72" y="80" fill="#9a9a92" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.2" text-anchor="start">WHAT IS LIVE</text>
  <text x="72" y="146" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="0" text-anchor="start">Shared core. Different extras.</text>
  <rect x="72" y="200" width="432" height="620" fill="#161616"/>
  <rect x="72" y="200" width="432" height="72" fill="#d8ff00"/>
  <text x="96" y="246" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1.2" text-anchor="start">SHARED</text>
  <rect x="96" y="320" width="384" height="58" fill="#2a2a2a"/>
  <text x="116" y="358" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Postgres</text>
  <rect x="96" y="396" width="384" height="58" fill="#2a2a2a"/>
  <text x="116" y="434" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">pgvector</text>
  <rect x="96" y="472" width="384" height="58" fill="#2a2a2a"/>
  <text x="116" y="510" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Row-level security</text>
