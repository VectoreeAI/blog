  <text x="1140" y="510" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Realtime</text>
  <rect x="1120" y="548" width="384" height="58" fill="#2a2a2a"/>
  <text x="1140" y="586" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Site deployment</text>
  <rect x="1120" y="624" width="384" height="58" fill="#2a2a2a"/>
  <text x="1140" y="662" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">MCP operator</text>
  <rect x="1120" y="700" width="384" height="58" fill="#2a2a2a"/>
  <text x="1140" y="738" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Self-host option</text>
