  <text x="628" y="586" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Tool Hub on the key</text>
  <rect x="608" y="624" width="384" height="58" fill="#2a2a2a"/>
  <text x="628" y="662" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">CLI and skills</text>
  <rect x="608" y="700" width="384" height="58" fill="#2a2a2a"/>
  <text x="628" y="738" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Same key for db and files</text>
