  <rect x="1096" y="200" width="432" height="72" fill="#f3f3ec"/>
  <text x="1120" y="246" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1.2" text-anchor="start">INSFORGE LIVE</text>
  <rect x="1120" y="320" width="384" height="58" fill="#2a2a2a"/>
  <text x="1140" y="358" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">OpenRouter models</text>
  <rect x="1120" y="396" width="384" height="58" fill="#2a2a2a"/>
  <text x="1140" y="434" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Edge functions</text>
