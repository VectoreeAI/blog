  <text x="628" y="358" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">Own model gateway</text>
  <rect x="608" y="396" width="384" height="58" fill="#2a2a2a"/>
  <text x="628" y="434" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0" text-anchor="start">vectoree/auto</text>
