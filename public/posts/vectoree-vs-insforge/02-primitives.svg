  <text x="608" y="246" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1.2" text-anchor="start">VECTOREE LIVE</text>
