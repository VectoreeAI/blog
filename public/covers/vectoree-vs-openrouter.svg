<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>Vectoree versus OpenRouter</title>
  <desc>OpenRouter is the deeper model router. A Vectoree project key also reaches auth, Postgres, storage, and tools.</desc>
  <rect width="1600" height="900" fill="#101010"/>
  <polygon points="1180,0 1600,0 1600,220" fill="#1c1c1c"/>
  <circle cx="1488" cy="72" r="6" fill="#d8ff00"/>
  <circle cx="1516" cy="72" r="6" fill="#d8ff00"/>
  <circle cx="1544" cy="72" r="6" fill="#d8ff00"/>
  <text x="72" y="78" fill="#9a9a92" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.4" text-anchor="start">EVALUATE  ·  INDIRECT COMPARISON</text>
  <text x="72" y="156" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="0" text-anchor="start">A gateway, or</text>
  <text x="72" y="228" fill="#d8ff00" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="0" text-anchor="start">the whole project?</text>
  <rect x="72" y="290" width="680" height="520" fill="#161616"/>
  <text x="104" y="350" fill="#9a9a92" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.6" text-anchor="start">OPENROUTER</text>
  <text x="104" y="420" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0" text-anchor="start">Model calls</text>
  <text x="104" y="500" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" text-anchor="start">Failover and fallbacks</text>
  <text x="104" y="552" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" text-anchor="start">Generation logs</text>
  <text x="104" y="604" fill="#f3f3ec" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" text-anchor="start">Spend guardrails</text>
  <text x="104" y="700" fill="#9a9a92" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">Stops at the model.</text>
  <text x="104" y="744" fill="#9a9a92" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">You bring users and data.</text>
  <rect x="848" y="290" width="680" height="520" fill="#d8ff00"/>
  <text x="880" y="350" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4" text-anchor="start">VECTOREE PROJECT KEY</text>
  <text x="880" y="420" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0" text-anchor="start">Models, plus</text>
  <text x="880" y="500" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="0" text-anchor="start">Auth</text>
  <text x="880" y="552" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="0" text-anchor="start">Postgres and storage</text>
  <text x="880" y="604" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="0" text-anchor="start">Tool Hub</text>
  <text x="880" y="700" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">Routing console is thinner.</text>
  <text x="880" y="744" fill="#101010" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">The key does more jobs.</text>
</svg>
